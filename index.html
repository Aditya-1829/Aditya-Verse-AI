<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="description" content="Aditya-Verse.AI — an AI assistant web app.">
<title>Aditya-Verse.AI — AI Assistant</title>
<style>
:root{--bg:#fff;--panel:#f7f7f8;--text:#202123;--muted:#6b7280;--border:#e5e7eb;--accent:#10a37f;--user:#f1f1f1}
body.dark{--bg:#212121;--panel:#171717;--text:#f5f5f5;--muted:#aaa;--border:#353535;--user:#2f2f2f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100vh;display:flex}.sidebar{width:270px;background:var(--panel);border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column}
.brand{font-weight:800;font-size:18px;padding:12px 8px 18px;display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center}
button{font:inherit}.new{padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);cursor:pointer}
.history{flex:1;overflow:auto;margin-top:20px}.item{padding:10px;border-radius:8px;cursor:pointer;font-size:13px}.item:hover{background:var(--user)}
.menu{border-top:1px solid var(--border);padding-top:10px}.menu button{width:100%;padding:11px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:8px;cursor:pointer}.menu button:hover{background:var(--user)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px}
.mobile{display:none;border:0;background:transparent;color:var(--text);font-size:22px}.badge{font-size:10px;background:#10a37f20;color:var(--accent);padding:4px 7px;border-radius:6px;font-weight:800}
.chat{flex:1;overflow:auto}.messages{max-width:820px;margin:auto;padding:30px 18px 150px}.message{display:flex;gap:12px;margin:24px 0;line-height:1.65}.avatar{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--accent);color:#fff}.user .avatar{background:#6366f1}.content{flex:1;min-width:0}.name{font-size:13px;font-weight:700;margin-bottom:4px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.copy{margin-top:7px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px}
.welcome{min-height:58vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.welcome .logo{width:66px;height:66px;font-size:30px;margin-bottom:20px}.welcome h1{font-size:34px;margin:0 0 8px}.welcome p{color:var(--muted)}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:650px;width:100%;margin-top:25px}.suggestion{padding:13px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;text-align:left;cursor:pointer}
.composer{position:absolute;bottom:0;left:270px;right:0;padding:18px;background:linear-gradient(transparent,var(--bg) 35%)}.box{max-width:820px;margin:auto;display:flex;gap:8px;border:1px solid var(--border);background:var(--bg);border-radius:16px;padding:9px;box-shadow:0 10px 30px #00000012}textarea{flex:1;resize:none;max-height:150px;border:0;outline:0;background:transparent;color:var(--text);padding:8px;font:inherit}.send{width:40px;height:40px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}.send:disabled{opacity:.45}.note{text-align:center;color:var(--muted);font-size:10px;margin-top:7px}
.typing{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
.overlay{display:none}
@media(max-width:700px){.sidebar{position:fixed;z-index:10;left:-285px;top:0;bottom:0;transition:.2s;box-shadow:10px 0 30px #0004}.sidebar.open{left:0}.overlay.show{display:block;position:fixed;inset:0;background:#0006;z-index:9}.mobile{display:block}.composer{left:0;padding:12px}.messages{padding:22px 14px 145px}.suggestions{grid-template-columns:1fr}.welcome h1{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="side">
<div class="brand"><div class="logo">✦</div><span>Aditya-Verse.AI</span></div>
<button class="new" onclick="newChat()">＋ New chat</button>
<div class="history" id="history"></div>
<div class="menu"><button onclick="toggleTheme()">🌙 Toggle theme</button><button onclick="about()">ℹ️ About</button></div>
</aside>
<div class="overlay" id="overlay" onclick="closeSide()"></div>
<main class="main">
<header class="top"><button class="mobile" onclick="openSide()">☰</button><b>Aditya-Verse.AI</b><span class="badge">AI</span></header>
<section class="chat" id="chat"><div class="messages" id="messages">
<div class="welcome" id="welcome"><div class="logo">✦</div><h1>How can I help you?</h1><p>Ask questions, learn, brainstorm or create.</p>
<div class="suggestions">
<button class="suggestion" onclick="suggest('Explain photosynthesis simply')">💡 Explain something</button>
<button class="suggestion" onclick="suggest('Help me create a modern website')">💻 Create a website</button>
<button class="suggestion" onclick="suggest('Give me school project ideas')">📚 School project ideas</button>
<button class="suggestion" onclick="suggest('Write a short story')">✍️ Creative writing</button>
</div></div></div></section>
<div class="composer"><div class="box"><textarea id="input" rows="1" placeholder="Message Aditya-Verse.AI..." onkeydown="key(event)" oninput="resize()"></textarea><button class="send" id="send" onclick="send()">↑</button></div><div class="note">AI responses may be inaccurate. Add your own branding, pricing and terms before commercial use.</div></div>
</main></div>
<script>
const $=id=>document.getElementById(id), input=$("input"), messages=$("messages");
let history=[];
function add(type,text){const m=document.createElement("div");m.className="message "+type;m.innerHTML='<div class="avatar">'+(type==="user"?"👤":"✦")+'</div><div class="content"><div class="name">'+(type==="user"?"You":"Aditya-Verse.AI")+'</div><div class="text"></div>'+(type==="ai"?'<button class="copy">📋 Copy</button>':"")+"</div>";m.querySelector(".text").textContent=text;if(type==="ai")m.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(text);messages.appendChild(m);$("chat").scrollTop=$("chat").scrollHeight}
function typing(){const m=document.createElement("div");m.id="typing";m.className="message ai";m.innerHTML='<div class="avatar">✦</div><div class="content"><div class="name">Aditya-Verse.AI</div><div class="typing"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div>';messages.appendChild(m);$("chat").scrollTop=$("chat").scrollHeight}
async function send(){const text=input.value.trim();if(!text)return;$("welcome")?.remove();add("user",text);input.value="";resize();$("send").disabled=true;typing();try{const res=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});const data=await res.json();$("typing")?.remove();if(!res.ok)throw new Error(data.error||"Request failed");add("ai",data.reply)}catch(e){$("typing")?.remove();add("ai","Sorry, I couldn't reach the AI server. Check the Netlify function and environment variable setup.")}finally{$("send").disabled=false;input.focus()}}
function key(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}
function suggest(t){input.value=t;send()}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"}
function newChat(){messages.innerHTML='<div class="welcome" id="welcome"><div class="logo">✦</div><h1>How can I help you?</h1><p>Start a new conversation.</p><div class="suggestions"><button class="suggestion" onclick="suggest(\'Explain something simply\')">💡 Explain something</button><button class="suggestion" onclick="suggest(\'Help me create a website\')">💻 Website help</button></div></div>';input.focus()}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("av-theme",document.body.classList.contains("dark")?"dark":"light")}
function openSide(){$("side").classList.add("open");$("overlay").classList.add("show")}function closeSide(){$("side").classList.remove("open");$("overlay").classList.remove("show")}
function about(){closeSide();alert("Aditya-Verse.AI\\n\\nA custom AI assistant frontend connected to a secure serverless backend.")}
if(localStorage.getItem("av-theme")==="dark")document.body.classList.add("dark");
</script>
</body>
</html>
